services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/server/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_REQUIRED: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DOCUMENTS_ROOT: /var/lib/fssp/documents
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Yekaterinburg}
      ALLOW_BOOTSTRAP: ${ALLOW_BOOTSTRAP:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-26214400}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - documents_data:/var/lib/fssp/documents
    networks: [private]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/server/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DOCUMENTS_ROOT: /var/lib/fssp/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - documents_data:/var/lib/fssp/documents
    networks: [private]

volumes:
  postgres_data:
  documents_data:

networks:
  private:
    driver: bridge
